# Тесты и сборка на каждый пуш и PR; на тег v* — релиз с готовым .app.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Test
        run: go vet ./... && go test ./...

      - name: Install Wails
        # та же версия, что в go.mod
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.info.productVersion = $v' wails.json > wails.json.tmp && mv wails.json.tmp wails.json

      - name: Build (Apple Silicon + Intel)
        run: wails build -platform darwin/universal

      - name: Package
        run: |
          name="Worktrees-${GITHUB_REF_NAME//\//-}-macos.zip"
          ditto -c -k --keepParent build/bin/Worktrees.app "$name"
          echo "ZIP=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Worktrees-macos
          path: ${{ env.ZIP }}
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Worktrees-macos

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Worktrees-*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
